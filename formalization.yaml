status:
  scope: >-
    Complete for the results listed in main_results. Theorem A has smooth initial
    data, the explicit constants of the statement, convergence up to the maximal
    existence time of the limit, and mollifier independence for these constants;
    rough initial data in C^alpha are not covered. The library statements of
    reconstruction and the Schauder estimate are formulated for regularity
    structures with a finite graded basis, distributions regularised by a
    semigroup, and global bounds on the model and the modelled distribution
    (Hairer's Theorems 3.10 and 5.12 are local). Reconstruction assumes gamma > 0;
    its test-function bound and uniqueness statement assume every degree below
    gamma exceeds -4, and uniqueness is among measurable distributions with a
    global power bound of exponent above -4. The Schauder statements are for the parabolic heat kernel
    with gain two, require every degree below gamma to exceed -2 (excluding the
    Phi^4_3 noise symbol), require the sector to be spanned by basis vectors (a
    coordinate sector), have an integration map without polynomial component and
    non-integrality conditions that can be stronger, and state only the first part
    of Theorem 5.12; they assume joint measurability of the model, and the identity
    (5.17) also assumes a global model bound up to level gamma + 2. The maximal-solution statements are the abstract patching argument behind
    Proposition 7.11. The global theory is for smooth initial data replaced by the
    whole state space C^eta, the unit torus, the constants of Theorem A and every
    eta in (-2/3, -1/2); the invariant measure is not claimed to be unique, the
    strong Feller property is not claimed, and the stationary solution is one-sided.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
