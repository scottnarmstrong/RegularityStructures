version: "v0.4"

project:
  name: "Regularity structures and dynamical Phi^4_3"
  description: >-
    A Lean 4 / Mathlib formalization of the renormalised dynamical Phi^4_3 model on
    the three-dimensional torus: convergence, local well-posedness, and global
    dynamics with an invariant measure and stationary solutions. The local theory
    follows Hairer's Theorem 1.15: for smooth initial data, explicit renormalisation
    constants built from the massive heat kernel, and every exponent eta in
    (-2/3, -1/2), the solutions of the equation driven by mollified space-time white
    noise converge in probability in the Hölder–Besov space C^eta up to the maximal
    existence time of the limit, and the limit does not depend on the mollifier. A
    standalone library proves the general theory used: the reconstruction theorem
    (Hairer, Theorem 3.10; Hoshino, Theorem 4.1), weighted reconstruction, the
    multilevel Schauder estimate (Hairer, Theorem 5.12), maximal solutions, and
    Malliavin calculus for white noise. On top of it, the global theory after
    Mourrat and Weber and Moinat and Weber: for every exponent eta in (-2/3, -1/2) a
    global flow on C^eta, adapted to the noise and consistent with Theorem A, that
    comes down from infinity, is a Feller Markov process and has an invariant measure
    obtained by the Krylov-Bogoliubov procedure, which is the law of a stationary
    solution; the uniform moment bound for the regularised equations behind it; and
    the compatibility of these flows across Hölder exponents.
  authors:
    - "Scott Armstrong"
  responsible_maintainers:
    - "Scott Armstrong"
  affiliations:
    - "Scott Armstrong: CNRS and Laboratoire Jacques-Louis Lions, Sorbonne Université; Courant Institute School of Mathematics, Computing, and Data Science, New York University"
  license: "Apache-2.0"
  funding:
    - "Scott Armstrong was supported by the European Research Council (ERC) under the European Union's Horizon Europe research and innovation programme, grant agreement No. 101200828."

