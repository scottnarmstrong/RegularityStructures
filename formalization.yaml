automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
        - "claude-sonnet-5-5"
        - "claude-fable-5-1"
        - "gpt-5.6-luna"
        - "gpt-6.1-sol"
      framework: >-
        Claude Code (Claude Opus 5.5 coordinating, Claude Sonnet 5.5, Claude Fable
        5.1) and Codex (GPT-5.6 Luna, GPT-6.1 Sol), under the author's supervision.
      tool_setup: >-
        Lean 4 and Mathlib v4.35.0-rc2. Every public statement was written first,
        compared with the sources by an independent model review, and approved by
        the author before its proof was developed. Verification uses full builds from
        a clean checkout and axiom checks of the main results.
      cost:
        wall_time: "about four days of development (23 to 26 October 2026) plus release preparation"
        spend_usd: "not separately tracked (ChatGPT Pro and Claude Max subscriptions)"
        hardware: "one 8-CPU / 30 GB RAM Linux machine"
      prompting_notes: >-
        The author determined the scope and the statements, chose the proof routes,
        and approved every public statement. Gaps in the printed proofs were filled
        by arguments proposed by the models and checked by separate model reviews
        before they were formalized.
  spend_usd: "not separately tracked (ChatGPT Pro and Claude Max subscriptions)"
  notes: >-
    All Lean code was written by the listed models under the supervision of the
    author. Every proof is checked by the Lean kernel; the library contains no sorry
    and no custom axiom.

fidelity:
  divergences: >-
    Theorem A has smooth initial data instead of data in C^alpha, explicit constants
    built from the massive heat kernel instead of suitably chosen constants, and
    convergence up to the maximal existence time of the limit instead of stopped
    processes. Reconstruction and the Schauder estimate are proved with a
    regularising semigroup, a finite graded basis and global bounds, with the
    degree restrictions listed under status.scope. The global theory is stated on the
    unit torus with the constants of Theorem A; the local estimate of Moinat and
    Weber is adapted to solutions with smooth defects. docs/ERRATA-AND-DEVIATIONS.md
    records every erratum and deviation with its effect on the stated theorems.

review:
  status: "author-verified"
  reviewers:
    - "Scott Armstrong"
  notes: >-
    Lean checks each proof against its formal statement. The author reviewed that
    the statements are the intended theorems. Each public statement was compared
    with the sources by independent model reviews before its proof was accepted.
    This is not external peer review.

alignment:
  - source: "Hairer, A theory of regularity structures, Theorem 1.15"
    lean: "RegularityStructures.Phi43.Statements.theoremA"
    note: "Smooth initial data; explicit constants; convergence in probability up to the maximal existence time; mollifier independence."
  - source: "The statement (docs/statement.pdf), Proposition 3.1"
    lean: "RegularityStructures.Phi43.Statements.proposition31"
    note: "Conditions (A1)-(A3) determine the limit."
  - source: "The statement (docs/statement.pdf), Lemma 4.1 (W1)-(W5)"
    lean: "RegularityStructures.Phi43.Statements.exists_whiteNoise"
    note: "The objects over which Theorem A quantifies exist; the other items are regularisedNoise_exists_unique, constants_finite, classicalSolution_exists_unique, classicalSolution_continuousOn and classicalSolution_measurable."
  - source: "Hairer, A theory of regularity structures, Theorem 3.10"
    lean: "RegularityStructures.Statements.Model.exists_reconstruction"
    note: "With a regularising semigroup in place of wavelets, after Hoshino, Theorem 4.1; the bound (3.4) is abs_reconstruct_sub_reconstruct_le."
  - source: "Hoshino, Theorem 4.1"
    lean: "RegularityStructures.Statements.RegularisingSemigroup.exists_reconstruction"
    note: "Reconstruction for coherent germs; the weighted form is exists_reconstruction_weighted."
  - source: "Hairer, A theory of regularity structures, Theorem 5.12"
    lean: "RegularityStructures.Statements.Model.kGamma_mem_modelledDistributions"
    note: "First part: the operator K_gamma maps D^gamma into D^(gamma+2); (5.17) is reconstruct_kGamma."
  - source: "Hairer, A theory of regularity structures, Proposition 7.11"
    lean: "RegularityStructures.Statements.exists_maximal_solution"
    note: "The abstract patching argument behind Proposition 7.11, for a solution relation with local existence, uniqueness, restriction and gluing."
  - source: "Mourrat and Weber 2017, and Moinat and Weber 2020: global dynamics"
    lean: "GlobalPhi43.Statements.globalDynamics"
    note: "Global flow on C^eta adapted to the noise, consistent with Theorem A, coming down from infinity (Mourrat-Weber (1.27)), time homogeneous, Feller Markov, with a Krylov-Bogoliubov invariant measure that is the law of a stationary solution."
  - source: "Moinat and Weber 2020, Theorem 2.1 (adapted); Mourrat and Weber 2017, (1.27)"
    lean: "GlobalPhi43.Statements.regularisedBound"
    note: "Moments of sup over smooth data and t in (0, 1] of sqrt(t) times the C^eta' norm of the regularised solutions, bounded uniformly in the regularisation by a constant chosen before the probability space."
  - source: "Compatibility across Hölder exponents"
    lean: "GlobalPhi43.Statements.exponentCompatibility"
    note: "The global flows for all eta in (-2/3, -1/2) chosen at once; for each admissible pair eta < eta'' < -1/2, almost surely the embedding of C^eta'' into C^eta intertwines the two flows for every 0 <= s <= t and every datum."

