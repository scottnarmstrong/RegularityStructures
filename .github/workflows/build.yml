name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check axioms
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Free runner disk space
        run: |
          set -Eeuo pipefail
          # Only remove preinstalled, unused SDKs on disposable hosted runners.
          if [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            sudo docker image prune --all --force > /dev/null || true
          fi
          df -h .
          available_kib="$(df -Pk . | awk 'NR==2 {print $4}')"
          test "$available_kib" -ge 20971520
      - name: Check Lean source requirements
        run: python3 scripts/check-lean-sources.py
      - name: Check for sorry, admit and axiom outside the Challenges
        run: python3 scripts/check-no-sorry.py
      - name: Validate formalization.yaml against the published schema
        run: |
          python3 -m venv "$RUNNER_TEMP/metadata"
          "$RUNNER_TEMP/metadata/bin/pip" install --quiet jsonschema==4.23.0 PyYAML==6.0.2
          "$RUNNER_TEMP/metadata/bin/python" scripts/check-metadata.py
      - name: Restore the build cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake
          key: build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
            comparator-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
      # This workflow saves its own cache key, so the action's built-in cache is off.
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: true
          use-github-cache: false
      - name: Save the build cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake
          key: build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
      - name: Check that no comparator module is shadowed by a dependency
        run: python3 scripts/check-comparator-layout.py
      - name: Print and check the axioms of the main theorems
        run: python3 scripts/check-axioms.py
